# These are all the settings you can configure in a config file.
# All values here are the defaults; omit any of them and the default is used instead.
# Empty colours use the terminal's colours.
# This file must match the defaults in internal/config/config.go and theme.go.

drill:
  start_year: 1900 # first year dates are drawn from (1-9999)
  end_year: 2099 # last year dates are drawn from (1-9999, not before start_year)
  single_year: false # drill only start_year, ignoring end_year
  show_doomsday: false # show the year's doomsday alongside each date
  cheatsheet: false # show the 0-7 weekday numbers under the prompt

theme:
  fg: "" # default fg for all text
  bg: "" # bg of the window
  selected: "#5a5a5a" # fg of the selected menu item, the active tab and the input prompt
  border: ""
  accent: "" # fg of the date being asked
  muted: "#6c6c6c" # fg of hints and timers
  correct: "#5faf5f" # right answers and the filled part of accuracy bars
  wrong: "#d75f5f" # wrong answers and the empty part of accuracy bars
